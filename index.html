
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LM Studio Chat v2026.04.27 (Streaming Enabled)</title>
<style>
body {
font-family: sans-serif;
max-width: 800px;
margin: 2rem auto;
padding: 0 1rem;
line-height: 1.6;
}
.container {
display: flex;
flex-direction: column;
gap: 1rem;
}
textarea {
width: 100%;
height: 250px;
padding: 0.5rem;
font-size: 1rem;
resize: vertical;
}
button {
padding: 0.75rem 1.5rem;
background-color: #007bff;
color: white;
border: none;
border-radius: 4px;
cursor: pointer;
font-size: 1rem;
}
button:hover {
background: #0056b3;
}
button:disabled {
background-color: #ccc;
cursor: not-allowed;
}

/* Specific style for the Clear button to make it red */
#clearBtn {
background-color: #dc3545;
}
#clearBtn:hover {
background-color: #a71d2a;
}

#result {
margin-top: 1rem;
padding: 1rem;
background-color: #f5f5f5;
border-radius: 4px;
border-left: 4px solid #007bff;
white-space: pre-wrap; /* Preserves formatting */
display: none;
}
.button-group {
display: flex;
gap: 0.5rem;
align-items: center;
}
.button-group-right {
margin-left: auto;
}
.loading {
color: #666;
font-style: italic;
}
</style>
</head>
<body>
<div class="container">
<h1>Chat with LM Studio (Streaming)</h1>
<table><tr><td width="15%">Model:</td><td>google/gemma-4-26b-a4b-qat</td></tr></table>
<textarea id="prompt" placeholder="Enter your question here..."></textarea>

<div class="button-group">
<button id="submitBtn" onclick="askLMStudio()">Submit</button>
<button id="clearBtn" onclick="clearInput()">Clear</button>
<div class="button-group-right">
<button id="savePromptBtn" onclick="savePrompt()">Save Prompt</button>
</div>
</div>

<div id="result"></div>
<button id="copyAnswerBtn" onclick="copyAnswer()">Copy Answer</button>
</div>

<script>

// Function to clear the textarea
function clearInput() {
    document.getElementById('prompt').value = '';
}

// Function to format date as YYYY.MM.DD
function formatDate(date) {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    return `${year}.${month}.${day}`;
}

// Function to get the next available version number
function getNextVersionNumber(dateStr) {
    const stored = JSON.parse(localStorage.getItem('promptVersions') || '{}');
    const todaysVersions = stored[dateStr] || [];
    if (todaysVersions.length === 0) {
        return 0;
    }
    return Math.max(...todaysVersions) + 1;
}

// Function to track a version number for a date
function trackVersion(dateStr, versionNumber) {
    const stored = JSON.parse(localStorage.getItem('promptVersions') || '{}');
    if (!stored[dateStr]) {
        stored[dateStr] = [];
    }
    if (!stored[dateStr].includes(versionNumber)) {
        stored[dateStr].push(versionNumber);
    }
    localStorage.setItem('promptVersions', JSON.stringify(stored));
}

// Function to save the prompt
async function savePrompt() {
    try {
        const promptText = document.getElementById('prompt').value.trim();

        if (!promptText) {
            alert('Please enter a question in the prompt box before saving.');
            return;
        }

        const selectedModel = 'google/gemma-4-26b-a4b-qat';
        const today = new Date();
        const dateStr = formatDate(today);
        const baseFilename = `Prompt LM Studio Stream Chat - ${dateStr}`;

        const versionNumber = getNextVersionNumber(dateStr);
        const filename = `${baseFilename} v${versionNumber}.txt`;

        const fileContent = `Title: LM Studio Stream Chat\nModel: ${selectedModel}\nDate: ${dateStr}\n-------------------------------------------\n\n${promptText}`;

        const blob = new Blob([fileContent], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        trackVersion(dateStr, versionNumber);

        alert(`Prompt file ready to save as:\n${filename}\n\nYour browser will save this to your Downloads folder by default.`);
    } catch (error) {
        console.error('Error saving prompt:', error);
        alert(`Error saving prompt: ${error.message}`);
    }
}

function copyAnswer() {
    const answerDiv = document.getElementById('answerText');
    if (!answerDiv) {
        alert('No answer available to copy.');
        return;
    }
    const answerText = answerDiv.innerText.trim();
    if (!answerText) {
        alert('No answer available to copy.');
        return;
    }
    navigator.clipboard.writeText(answerText)
        .then(() => {
            alert('Answer copied to clipboard.');
        })
        .catch((err) => {
            console.error('Clipboard copy failed:', err);
            alert('Copy failed. Please try again or use your browser clipboard directly.');
        });
}
        
async function askLMStudio() {
    const startTime = Date.now();
    const promptInput = document.getElementById('prompt');
    const resultDiv = document.getElementById('result');
    const submitButton = document.getElementById('submitBtn');
    const prompt = promptInput.value.trim();

    if (!prompt) {
        alert("Please enter a question.");
        return;
    }

    // UI Updates
    resultDiv.style.display = 'block';
    resultDiv.innerHTML = "<font size='2'><span id='statusText' class='loading'>Thinking...</span></font><hr><br><div id='answerText'></div>";
    submitButton.disabled = true;

    let fullContent = "";
    const statusDiv = document.getElementById('statusText');
    const answerDiv = document.getElementById('answerText');

    try {
        const response = await fetch('http://localhost:3000/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt })
        });

        if (!response.ok) {
            const errorText = await response.text();
            throw new Error(`Server Error: ${response.status} - ${errorText}`);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let pending = '';

        const handleEvent = line => {
            if (!line.trim()) return;
            const event = JSON.parse(line);
            if (event.type === 'status') {
                statusDiv.textContent = event.message;
            } else if (event.type === 'final') {
                fullContent = event.content || '';
                answerDiv.textContent = fullContent;
            } else if (event.type === 'error') {
                throw new Error(event.message);
            }
        };

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            pending += decoder.decode(value, { stream: true });
            const lines = pending.split('\n');
            pending = lines.pop();
            for (const line of lines) handleEvent(line);
        }
        pending += decoder.decode();
        handleEvent(pending);

        // Finalize display with total time
        const totalTime = Math.round((Date.now() - startTime) / 1000);
        statusDiv.textContent = `Total time: ${totalTime} seconds`;

    } catch (error) {
        console.error(error);
        let errorMsg = "Error: Could not connect to the agent backend.";
        if (error.message.includes("Failed to fetch")) {
            errorMsg += " Ensure the agent server is running and LM Studio is available.";
        } else {
            errorMsg += error.message;
        }
        resultDiv.textContent = errorMsg;
    } finally {
        submitButton.disabled = false;
    }
}
</script>
</body>
</html>
